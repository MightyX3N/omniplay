name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y luajit lua5.1 lua5.4 nodejs love xvfb
      - name: Test the SDK (Lua and JS cores against the same device data)
        run: luajit tests/test_sdk.lua && lua5.1 tests/test_sdk.lua && lua5.4 tests/test_sdk.lua && node tests/sdk/test_sdk.mjs
      - name: Test the app (plays it with pretend devices)
        run: OMNIPLAY_FAKE=1 OMNIPLAY_SCRIPT="$PWD/tests/app/full.lua" xvfb-run -a love app

  windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip
      - name: Build
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OmniPlay-windows
          path: dist/OmniPlay/
      - uses: actions/upload-artifact@v4
        with:
          name: OmniPlay-SDK
          path: dist/sdk/OmniPlay-SDK/
