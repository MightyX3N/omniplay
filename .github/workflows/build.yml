name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y luajit lua5.1 lua5.4 nodejs zip
      - name: Test the SDK (Lua and JS cores against the same device data)
        run: luajit tests/test_sdk.lua && lua5.1 tests/test_sdk.lua && lua5.4 tests/test_sdk.lua && node tests/sdk/test_sdk.mjs
      - name: Package the SDK
        run: |
          mkdir -p dist/OmniPlay-SDK
          cp -r sdk/lua sdk/js sdk/android sdk/LICENSE docs/SDK.md dist/OmniPlay-SDK/
      - uses: actions/upload-artifact@v4
        with:
          name: OmniPlay-SDK
          path: dist/OmniPlay-SDK/
