name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 luajit lua-socket zip
      - name: Test
        run: luajit tests/test_sperax.lua && luajit tests/test_ftms.lua && luajit tests/test_output.lua && luajit tests/test_session.lua && luajit tests/test_api.lua && luajit tests/test_main.lua
      - name: Build
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OmniPlay-windows
          path: dist/OmniPlay/
